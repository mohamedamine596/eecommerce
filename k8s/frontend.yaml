apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend, version: v1 }
  template:
    metadata:
      labels: { app: frontend, version: v1 }
    spec:
      containers:
        - name: frontend
          image: aminebougui/ecommerce-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - name: http-frontend
      port: 80
      targetPort: 80
