apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ecommerce-gateway
  namespace: ecommerce
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ecommerce
  namespace: ecommerce
spec:
  hosts: ["*"]
  gateways: [ecommerce-gateway]
  http:
    - match:
        - uri: { prefix: /api }
      route:
        - destination: { host: backend, port: { number: 3000 } }
    - route:
        - destination: { host: frontend, port: { number: 80 } }
